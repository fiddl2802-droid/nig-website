<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 890" width="1240" height="890" role="img" aria-labelledby="t d">
<title id="t">Welche KI-Lösung passt zu Ihrem Unternehmen?</title>
<desc id="d">Vergleich von Abo-Chatbot, KI per Schnittstelle, eigenem Cloud-Server und lokaler KI nach Einstieg, Datenschutz, Qualität und Kosten.</desc>
<style>
:root{--navy:#2b3020;--accent:#9aa86a;--bg:#353a27;--card:#3d4330;--line:#4c5340;--muted:#b4b3a4;--fg:#e4e2d8;--ink:#232819}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}.navy{fill:var(--navy);stroke:var(--line);stroke-width:1.5}.acc{fill:var(--accent)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Garamond,Georgia,serif}
.h1{font-size:32px;font-weight:600;fill:var(--fg);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.sub{font-size:16px;fill:var(--accent)}
.logo{font-size:36px;font-weight:600;fill:var(--fg);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.tag{font-size:11px;fill:var(--muted);letter-spacing:2.6px}
.ch{font-size:17px;font-weight:600;fill:var(--fg);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.cs{font-size:12.5px;fill:var(--muted)}
.badge{font-size:15px;font-weight:700;fill:var(--ink)}
.rl{font-size:17px;font-weight:600;fill:var(--fg);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.rs{font-size:11.5px;fill:var(--muted)}
.l1{font-size:14px;font-weight:700;fill:var(--fg)}
.l2{font-size:12.5px;fill:var(--muted)}
.pt{font-size:12.5px;font-weight:700;fill:var(--ink)}
.good{fill:#9aa86a}.ok{fill:#c3cc96}.mid{fill:#dcc27a}.warn{fill:#e0976a}.bad{fill:#e07a6a}
.gl{font-size:12.5px;fill:var(--muted)}
.ft{font-size:15px;font-weight:600;fill:var(--fg)}
.ft.acc{fill:var(--accent)}
</style>
<rect class="bg" width="1240" height="890"/>
<rect class="navy" width="1240" height="130"/>
<rect class="acc" width="1240" height="5" y="125"/>
<text class="h1" x="40" y="62">Welche KI-Lösung passt zu Ihrem Unternehmen?</text>
<text class="sub" x="40" y="98">Vier Wege, KI einzuführen – einfach verglichen</text>
<text class="logo" x="1200" y="68" text-anchor="end">N<tspan class="acc" font-style="italic">i</tspan>G</text>
<text class="tag" x="1200" y="92" text-anchor="end">NEXT INTELLIGENCE GROUP</text>
<rect class="navy" x="210" y="150" width="240" height="86" rx="14"/>
<circle class="acc" cx="240" cy="193" r="15"/>
<text class="badge" x="240" y="198.5" text-anchor="middle">1</text>
<text class="ch" x="266" y="188">Abo-Chatbot</text>
<text class="cs" x="266" y="208">z. B. ChatGPT, Claude, Gemini</text>
<rect class="navy" x="462" y="150" width="240" height="86" rx="14"/>
<circle class="acc" cx="492" cy="193" r="15"/>
<text class="badge" x="492" y="198.5" text-anchor="middle">2</text>
<text class="ch" x="518" y="188">KI per Schnittstelle</text>
<text class="cs" x="518" y="208">API, Bezahlung nach Nutzung</text>
<rect class="navy" x="714" y="150" width="240" height="86" rx="14"/>
<circle class="acc" cx="744" cy="193" r="15"/>
<text class="badge" x="744" y="198.5" text-anchor="middle">3</text>
<text class="ch" x="770" y="188">Eigener Cloud-Server</text>
<text class="cs" x="770" y="208">Gemietet, selbst betrieben</text>
