<text class="l1" x="478" y="418">Mit Vertrag (AVV) möglich</text>
<text class="l2" x="478" y="437">EU-Region wählbar</text>
<rect class="card" x="714" y="356" width="240" height="96" rx="14"/>
<rect class="good" x="730" y="370" width="118" height="24" rx="12"/>
<text class="pt" x="789" y="386.5" text-anchor="middle">Sehr gut</text>
<text class="l1" x="730" y="418">Daten bleiben bei Ihnen</text>
<text class="l2" x="730" y="437">Standort in der EU</text>
<rect class="card" x="966" y="356" width="240" height="96" rx="14"/>
<rect class="good" x="982" y="370" width="118" height="24" rx="12"/>
<text class="pt" x="1041" y="386.5" text-anchor="middle">Höchste Stufe</text>
<text class="l1" x="982" y="418">Daten bleiben im Haus</text>
<text class="l2" x="982" y="437">Auch offline nutzbar</text>
<rect class="card" x="30" y="460" width="168" height="96" rx="14"/>
<rect class="acc" x="30" y="478" width="5" height="60" rx="2.5"/>
<text class="rl" x="50" y="504">Qualität</text>
<text class="rs" x="50" y="524">Wie gut sind Antworten?</text>
<rect class="card" x="210" y="460" width="240" height="96" rx="14"/>
<rect class="good" x="226" y="474" width="118" height="24" rx="12"/>
<text class="pt" x="285" y="490.5" text-anchor="middle">Sehr gut</text>
<text class="l1" x="226" y="522">Die besten KI-Modelle</text>
<text class="l2" x="226" y="541">Immer auf neuestem Stand</text>
<rect class="card" x="462" y="460" width="240" height="96" rx="14"/>
<rect class="ok" x="478" y="474" width="118" height="24" rx="12"/>
<text class="pt" x="537" y="490.5" text-anchor="middle">Gut</text>
<text class="l1" x="478" y="522">Starke Modelle, schnell</text>
<text class="l2" x="478" y="541">Ideal für Standardaufgaben</text>
<rect class="card" x="714" y="460" width="240" height="96" rx="14"/>
<rect class="ok" x="730" y="474" width="118" height="24" rx="12"/>
<text class="pt" x="789" y="490.5" text-anchor="middle">Gut</text>
<text class="l1" x="730" y="522">Große offene Modelle</text>
<text class="l2" x="730" y="541">Leistung nach Server-Größe</text>
<rect class="card" x="966" y="460" width="240" height="96" rx="14"/>
<rect class="mid" x="982" y="474" width="118" height="24" rx="12"/>
<text class="pt" x="1041" y="490.5" text-anchor="middle">Mittel</text>
<text class="l1" x="982" y="522">Kleinere offene Modelle</text>
<text class="l2" x="982" y="541">Abhängig von Ihrer Hardware</text>
<rect class="card" x="30" y="564" width="168" height="96" rx="14"/>
<rect class="acc" x="30" y="582" width="5" height="60" rx="2.5"/>
<text class="rl" x="50" y="608">Kosten</text>
<text class="rs" x="50" y="628">Was kostet es ungefähr?</text>
<rect class="card" x="210" y="564" width="240" height="96" rx="14"/>
<rect class="good" x="226" y="578" width="118" height="24" rx="12"/>
<text class="pt" x="285" y="594.5" text-anchor="middle">Planbar</text>
<text class="l1" x="226" y="626">8–200 € pro Monat</text>
<text class="l2" x="226" y="645">Feste Preise, mit Tageslimits</text>
<rect class="card" x="462" y="564" width="240" height="96" rx="14"/>
<rect class="good" x="478" y="578" width="118" height="24" rx="12"/>
<text class="pt" x="537" y="594.5" text-anchor="middle">Niedrig</text>
<text class="l1" x="478" y="626">ca. 5–50 € pro Monat</text>
<text class="l2" x="478" y="645">Sie zahlen nur, was Sie nutzen</text>
<rect class="card" x="714" y="564" width="240" height="96" rx="14"/>
<rect class="bad" x="730" y="578" width="118" height="24" rx="12"/>
<text class="pt" x="789" y="594.5" text-anchor="middle">Hoch</text>
<text class="l1" x="730" y="626">ca. 300–2.000 € pro Monat</text>
<text class="l2" x="730" y="645">Ohne Nutzungslimits</text>
<rect class="card" x="966" y="564" width="240" height="96" rx="14"/>
<rect class="mid" x="982" y="578" width="118" height="24" rx="12"/>
<text class="pt" x="1041" y="594.5" text-anchor="middle">Einmalig hoch</text>
<text class="l1" x="982" y="626">1.500–10.000 € einmalig</text>
<text class="l2" x="982" y="645">Danach kaum laufende Kosten</text>
<rect class="card" x="30" y="668" width="168" height="96" rx="14"/>
<rect class="acc" x="30" y="686" width="5" height="60" rx="2.5"/>
<text class="rl" x="50" y="712">Passt für</text>
<text class="rs" x="50" y="732">Typischer Einsatz</text>
<rect class="card" x="210" y="668" width="240" height="96" rx="14"/>
<text class="l1" x="226" y="712">Ausprobieren</text>
<text class="l2" x="226" y="734">Einzelpersonen, kleine Teams</text>
<rect class="card" x="462" y="668" width="240" height="96" rx="14"/>
<text class="l1" x="478" y="712">Automatisierung</text>
<text class="l2" x="478" y="734">Chatbots und eigene Apps</text>
<rect class="card" x="714" y="668" width="240" height="96" rx="14"/>
<text class="l1" x="730" y="712">Teams mit Datenschutz</text>
<text class="l2" x="730" y="734">Viele Nutzer, feste Last</text>
<rect class="card" x="966" y="668" width="240" height="96" rx="14"/>
<text class="l1" x="982" y="712">Sensible Daten</text>
<text class="l2" x="982" y="734">Dokumente, Offline-Betrieb</text>
<text class="gl" x="40" y="796">AVV = Datenschutzvertrag mit dem Anbieter  ·  API = Schnittstelle, über die Programme die KI nutzen  ·  Offene Modelle = frei verfügbare KI, die man selbst betreiben kann</text>
<text class="gl" x="40" y="816">Richtwerte, Stand Oktober 2026 – Preise und Modelle ändern sich laufend.</text>
<rect class="navy" x="0" y="830" width="1240" height="60"/>
<text class="ft" x="40" y="866">Unsicher, was passt? NiG berät Sie unverbindlich.</text>
<text class="ft acc" x="1200" y="866" text-anchor="end">nig-ki.de</text>
</svg>