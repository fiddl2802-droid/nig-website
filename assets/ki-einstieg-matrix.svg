<circle class="acc" cx="996" cy="193" r="15"/>
<text class="badge" x="996" y="198.5" text-anchor="middle">4</text>
<text class="ch" x="1022" y="188">Lokal im Haus</text>
<text class="cs" x="1022" y="208">Eigene Hardware im Netzwerk</text>
