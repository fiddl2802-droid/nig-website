<rect class="good" x="226" y="266" width="118" height="24" rx="12"/>
<text class="pt" x="285" y="282.5" text-anchor="middle">Sehr einfach</text>
<text class="l1" x="226" y="314">Anmelden und loslegen</text>
<text class="l2" x="226" y="333">Kein Technikwissen nötig</text>
<rect class="card" x="462" y="252" width="240" height="96" rx="14"/>
<rect class="mid" x="478" y="266" width="118" height="24" rx="12"/>
<text class="pt" x="537" y="282.5" text-anchor="middle">Mittel</text>
<text class="l1" x="478" y="314">Anbindung per Programm</text>
<text class="l2" x="478" y="333">Etwas IT-Wissen nötig</text>
<rect class="card" x="714" y="252" width="240" height="96" rx="14"/>
<rect class="warn" x="730" y="266" width="118" height="24" rx="12"/>
<text class="pt" x="789" y="282.5" text-anchor="middle">Aufwändig</text>
<text class="l1" x="730" y="314">Server einrichten</text>
<text class="l2" x="730" y="333">Fachwissen und Betreuung</text>
<rect class="card" x="966" y="252" width="240" height="96" rx="14"/>
<rect class="warn" x="982" y="266" width="118" height="24" rx="12"/>
